##############################################################################
# GFA — greenfreightacademy.co.za
# Nginx reverse proxy configuration
#
# DEPLOYMENT STEPS:
# 1. Copy this file:
#    sudo cp nginx.conf /etc/nginx/sites-available/greenfreightacademy.co.za
# 2. Enable it:
#    sudo ln -s /etc/nginx/sites-available/greenfreightacademy.co.za \
#               /etc/nginx/sites-enabled/
# 3. Test and reload:
#    sudo nginx -t && sudo systemctl reload nginx
# 4. Get SSL certificate:
#    sudo certbot --nginx -d greenfreightacademy.co.za -d www.greenfreightacademy.co.za
#
# IMPORTANT: Replace /home/ubuntu/sites/gfa with the actual absolute path
#            where you extracted the deployment package.
##############################################################################

server {
    listen 80;
    server_name greenfreightacademy.co.za www.greenfreightacademy.co.za;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name greenfreightacademy.co.za www.greenfreightacademy.co.za;

    ssl_certificate     /etc/letsencrypt/live/greenfreightacademy.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenfreightacademy.co.za/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── CRITICAL: Static assets must be served directly by Nginx ─────────────
    # Without this block, CSS and JS will not load (pages will have no styling).
    # Update the alias path to match your actual deployment directory.
    location /_next/static/ {
        alias /home/ubuntu/sites/gfa/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /public/ {
        alias /home/ubuntu/sites/gfa/public/;
        expires 30d;
        access_log off;
    }

    location /favicon.ico {
        alias /home/ubuntu/sites/gfa/public/favicon.ico;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
